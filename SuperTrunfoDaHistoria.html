<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Trunfo da História</title>
<style>
:root{--bg:#14110f;--bg2:#241c15;--gold:#d4a84b;--ink:#f3e9d2;--mut:#a8987a;--win:#3fbf6f;--lose:#e5484d;--draw:#e0b13a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Georgia,'Times New Roman',serif;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%);color:var(--ink);min-height:100vh}
h1,h2,h3{font-weight:normal}
.screen{display:none;max-width:1000px;margin:0 auto;padding:20px 14px 40px}
.screen.active{display:block}
.title{text-align:center;margin:20px 0 6px;font-size:clamp(28px,6vw,48px);color:var(--gold);letter-spacing:2px;text-shadow:0 2px 12px #000}
.sub{text-align:center;color:var(--mut);margin-bottom:26px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.theme{background:linear-gradient(160deg,#2f2418,#1b140d);border:2px solid #4a3a22;border-radius:16px;padding:22px;cursor:pointer;text-align:center;transition:.25s;box-shadow:0 8px 20px #0008}
.theme:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 14px 30px #d4a84b33}
.theme .em{font-size:54px}
.theme h3{font-size:22px;color:var(--gold);margin:8px 0}
.theme p{color:var(--mut);font-size:14px;line-height:1.4}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:760px;margin:0 auto 26px}
.diff{background:#00000055;border:2px solid #4a3a22;border-radius:12px;padding:12px;cursor:pointer;text-align:center;transition:.2s;color:var(--ink);font-family:inherit}
.diff b{display:block;font-size:18px;margin-bottom:4px}
.diff span{font-size:12px;color:var(--mut);line-height:1.3;display:block}
.diff:hover{border-color:var(--gold)}
.diff.on{border-color:var(--gold);background:#d4a84b26;box-shadow:0 0 16px #d4a84b44}
.lbl{text-align:center;color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:13px;margin-bottom:10px}
.turn{text-align:center;margin-bottom:12px;font-size:15px}
.turn span{display:inline-block;padding:6px 18px;border-radius:20px;border:1px solid var(--gold);background:#00000066;color:var(--gold)}
.turn span.bot{border-color:var(--lose);color:#ff8f93}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pl{background:#00000055;border:1px solid #4a3a22;border-radius:12px;padding:8px 14px;min-width:150px}
.pl b{display:block;font-size:13px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.hearts{font-size:22px;letter-spacing:3px;min-height:28px}
.hearts .off{filter:grayscale(1) opacity(.3)}
.hearts.hit{animation:shake .5s}
.mid{text-align:center;font-size:14px;color:var(--mut)}
.mid strong{color:var(--gold);display:block;font-size:16px}
.table{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;justify-items:center}
.slot h4{text-align:center;color:var(--mut);font-weight:normal;margin-bottom:8px;letter-spacing:1px;font-size:13px;text-transform:uppercase}
.vs{align-self:center;font-size:30px;color:var(--gold);text-shadow:0 0 12px #d4a84b88}
.card{width:270px;height:410px;perspective:1000px}
.inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face,.back{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px}
.face{background:linear-gradient(170deg,#f6ecd0,#e2cf9f);color:#2a1d0c;border:5px solid var(--gold);box-shadow:0 12px 30px #000a,inset 0 0 30px #8a6a2a55;padding:12px;display:flex;flex-direction:column;transform:rotateY(180deg)}
.card.front .face{transform:none}
.card.front .back{display:none}
.back{background:repeating-linear-gradient(45deg,#3a1f14 0 12px,#2c170e 12px 24px);border:5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:70px;box-shadow:0 12px 30px #000a}
.art{height:96px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:56px;background:radial-gradient(circle,#fff8 0,transparent 70%),linear-gradient(135deg,#a8843a,#5a3d14);border:2px solid #5a3d14}
.cn{font-size:19px;font-weight:bold;text-align:center;margin-top:8px;line-height:1.1}
.ct{text-align:center;font-size:11px;font-style:italic;color:#6b4d1c;margin:2px 0 6px;text-transform:uppercase;letter-spacing:1px}
.cd{font-size:12px;line-height:1.3;text-align:justify;flex:1;overflow:hidden;color:#3d2b10}
.attrs{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.at{display:flex;flex-direction:column;background:#2a1d0c14;border:2px solid transparent;border-radius:8px;padding:4px 8px;font-size:12px;transition:.2s}
.at .r{display:flex;justify-content:space-between;font-weight:bold}
.bar{height:6px;background:#2a1d0c30;border-radius:3px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a14,#d4a84b);border-radius:3px}
.card.pick .at{cursor:pointer}
.card.pick .at:hover{background:#d4a84b55;border-color:#8a5a14;transform:scale(1.03)}
.at.sel{border-color:#2a1d0c;background:#d4a84b88}
.at.won{border-color:var(--win);background:#3fbf6f44}
.at.lost{border-color:var(--lose);background:#e5484d33}
.at.tie{border-color:var(--draw);background:#e0b13a44}
.card.glow .face{animation:glow 1s ease-in-out infinite alternate}
.banner{text-align:center;margin:18px 0 6px;min-height:64px}
.banner .msg{display:inline-block;padding:10px 34px;font-size:30px;border-radius:12px;animation:pop .5s;letter-spacing:2px}
.msg.win{background:#3fbf6f26;color:var(--win);border:2px solid var(--win)}
.msg.lose{background:#e5484d26;color:var(--lose);border:2px solid var(--lose)}
.msg.draw{background:#e0b13a26;color:var(--draw);border:2px solid var(--draw)}
.hint{text-align:center;color:var(--mut);font-size:14px;min-height:20px}
.btn{background:linear-gradient(180deg,#e6bd5c,#b78a2c);color:#20150a;border:none;border-radius:10px;padding:12px 28px;font:bold 16px Georgia,serif;cursor:pointer;box-shadow:0 5px 14px #0007;transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn.sec{background:#0000;color:var(--gold);border:2px solid var(--gold)}
.actions{text-align:center;margin-top:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}
.box{background:linear-gradient(160deg,#33261a,#1a120b);border:3px solid var(--gold);border-radius:20px;padding:34px 30px;text-align:center;max-width:420px;animation:pop .5s}
.box .big{font-size:70px}
.box h2{font-size:36px;margin:6px 0}
.box.v h2{color:var(--win)}
.box.d h2{color:var(--lose)}
.box p{color:var(--mut);margin-bottom:20px;line-height:1.4}
.who{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:8px;background:#2a1d0c;color:#f3e9d2;font-size:10px;font-weight:normal;letter-spacing:.5px;text-transform:uppercase;vertical-align:middle}
.who.bot{background:#8b2226}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{from{box-shadow:0 12px 30px #000a,0 0 8px #d4a84b}to{box-shadow:0 12px 30px #000a,0 0 30px #ffd97a}}
@keyframes deal{0%{transform:translateY(-40px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.deal{animation:deal .5s}
@media(max-width:640px){.table{grid-template-columns:1fr;gap:6px}.vs{font-size:22px}.card{width:min(270px,88vw)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="sMenu" class="screen active">
  <h1 class="title">⚜ SUPER TRUNFO DA HISTÓRIA ⚜</h1>
  <p class="sub">Escolha a dificuldade e um acontecimento histórico para enfrentar o Bot. Cada um começa com 5 vidas!</p>
  <div class="lbl">1. Dificuldade</div>
  <div class="diffs" id="diffs"></div>
  <div class="lbl">2. Acontecimento histórico</div>
  <div class="themes" id="themes"></div>
</section>

<section id="sGame" class="screen">
  <div class="hud">
    <div class="pl"><b>Você</b><div class="hearts" id="hpP"></div></div>
    <div class="mid"><strong id="themeName"></strong>Rodada <span id="roundN">1</span></div>
    <div class="pl"><b>Bot</b><div class="hearts" id="hpB"></div></div>
  </div>
  <div class="turn" id="turnBadge"></div>
  <div class="table">
    <div class="slot"><h4>Sua carta</h4><div id="cardP"></div></div>
    <div class="vs">⚔</div>
    <div class="slot"><h4>Carta do Bot</h4><div id="cardB"></div></div>
  </div>
  <div class="banner" id="banner"></div>
  <div class="hint" id="hint"></div>
  <div class="actions">
    <button class="btn" id="btnNext" style="display:none">Próxima rodada ▶</button>
    <button class="btn sec" id="btnMenu">Trocar tema</button>
  </div>
</section>

<div class="modal" id="modal">
  <div class="box" id="box">
    <div class="big" id="endEm"></div>
    <h2 id="endT"></h2>
    <p id="endP"></p>
    <div class="actions">
      <button class="btn" id="btnRestart">Jogar novamente</button>
      <button class="btn sec" id="btnMenu2">Trocar tema</button>
    </div>
  </div>
</div>

{n:"Dom Pedro I",e:"🗡",t:"Príncipe e 1º imperador",d:"Herdeiro do trono português, proclamou a Independência às margens do Ipiranga, em 7 de setembro de 1822.",pol:96,pop:82,ide:78},

{n:"Maria Quitéria",e:"🎖",t:"Soldada baiana",d:"Vestiu-se de homem para lutar nas guerras da Independência na Bahia, tornando-se heroína nacional.",pol:25,pop:90,ide:80},

{n:"Cortes de Lisboa",e:"🏰",t:"Parlamento português",d:"Exigiram a volta de Pedro a Portugal e tentaram recolonizar o Brasil, provocando a reação que levou à Independência.",pol:82,pop:30,ide:45},
{n:"Maria Felipa",e:"🔥",t:"Heroína de Itaparica",d:"Mulher negra que liderou defensoras da ilha e incendiou embarcações portuguesas na Bahia.",pol:20,pop:92,ide:75}
]}
];

var $=function(id){return document.getElementById(id)};
var DIFFS=[
  {id:"facil",n:"😊 Fácil",d:"O Bot escolhe o atributo de forma 100% aleatória."},
  {id:"medio",n:"😐 Médio",d:"O Bot escolhe o atributo de maior valor da carta dele."},
  {id:"dificil",n:"😈 Difícil",d:"O Bot analisa sua carta e escolhe o atributo com maior chance de vencer."}
];
var st={theme:null,diff:"medio",turn:"p",hp:{p:5,b:5},pileP:[],pileB:[],cp:null,cb:null,round:0,locked:true};

function attrName(k){return ATTRS.filter(function(x){return x.k===k})[0].n}
function randOf(a){return a[Math.floor(Math.random()*a.length)]}

/* Escolha do Bot conforme a dificuldade */
function botPick(){
  var keys=ATTRS.map(function(a){return a.k});
  if(st.diff==="facil")return randOf(keys);
  var score=function(k){return st.diff==="medio"?st.cb[k]:st.cb[k]-st.cp[k]};
  var best=-Infinity,cands=[];
  keys.forEach(function(k){
    var s=score(k);
    if(s>best){best=s;cands=[k]}else if(s===best){cands.push(k)}
  });
  return randOf(cands);
}

function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t}return r}
function show(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active")});$(id).classList.add("active")}

function buildMenu(){
  var dc=$("diffs");dc.innerHTML="";
  DIFFS.forEach(function(df){
    var b=document.createElement("button");
    b.className="diff"+(df.id===st.diff?" on":"");
    b.innerHTML="<b>"+df.n+"</b><span>"+df.d+"</span>";
    b.onclick=function(){
      st.diff=df.id;
      dc.querySelectorAll(".diff").forEach(function(x){x.classList.remove("on")});
      b.classList.add("on");
    };
    dc.appendChild(b);
  });
  var c=$("themes");c.innerHTML="";
  THEMES.forEach(function(t){
    var d=document.createElement("div");d.className="theme";d.tabIndex=0;
    d.innerHTML='<div class="em">'+t.em+'</div><h3>'+t.name+'</h3><p>'+t.desc+'</p><p style="margin-top:10px;color:#d4a84b">10 cartas</p>';
    d.onclick=function(){start(t)};
    d.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();start(t)}};
    c.appendChild(d);
  });
}

function hearts(who){
  var h="";for(var i=0;i<5;i++){h+='<span class="'+(i<st.hp[who]?"on":"off")+'">❤️</span>'}
  $(who==="p"?"hpP":"hpB").innerHTML=h;
}

function draw(who){
  var key=who==="p"?"pileP":"pileB";
  if(!st[key].length)st[key]=shuffle(st.theme.cards);
  return st[key].pop();
}

function cardHTML(c,pick,front){
  var h='<div class="card '+(front?"front ":"")+(pick?"pick":"")+'"><div class="inner">';
  h+='<div class="back">⚜</div><div class="face">';
  h+='<div class="art">'+c.e+'</div><div class="cn">'+c.n+'</div><div class="ct">'+c.t+'</div><div class="cd">'+c.d+'</div><div class="attrs">';
  ATTRS.forEach(function(a){
    h+='<div class="at" data-k="'+a.k+'"><div class="r"><span>'+a.e+' '+a.n+'</span><span>'+c[a.k]+'</span></div><div class="bar"><i style="width:'+c[a.k]+'%"></i></div></div>';
  });
  return h+'</div></div></div></div>';
}

function start(t){
  st.theme=t;st.hp={p:5,b:5};st.pileP=shuffle(t.cards);st.pileB=shuffle(t.cards);st.round=0;st.turn="p";
  var dn=DIFFS.filter(function(x){return x.id===st.diff})[0].n;
  $("themeName").textContent=t.name+" · "+dn;
  $("modal").classList.remove("show");
  show("sGame");
  newRound();
}

function newRound(){
  st.round++;st.locked=false;
  st.cp=draw("p");
  do{st.cb=draw("b")}while(st.cb===st.cp);
  $("roundN").textContent=st.round;
  hearts("p");hearts("b");
  $("banner").innerHTML="";
  $("btnNext").style.display="none";
  var mine=st.turn==="p";
  $("turnBadge").innerHTML=mine?'<span>🎯 Sua vez de escolher o atributo</span>':'<span class="bot">🤖 Vez do Bot escolher o atributo</span>';
  $("cardP").innerHTML=cardHTML(st.cp,mine,true);
  $("cardB").innerHTML=cardHTML(st.cb,false,false);
  $("cardP").firstChild.classList.add("deal");
  $("cardB").firstChild.classList.add("deal");
  if(mine){
    $("hint").textContent="Escolha um atributo da sua carta para batalhar!";
    $("cardP").querySelectorAll(".at").forEach(function(el){
      el.onclick=function(){choose(el.getAttribute("data-k"),false)};
    });
  }else{
    $("hint").textContent="O Bot está escolhendo o atributo...";
    var round=st.round,theme=st.theme;
    setTimeout(function(){
      if(st.theme!==theme||st.round!==round||st.locked)return;
      choose(botPick(),true);
    },1300);
  }
}

function choose(k,byBot){
  if(st.locked)return;
  st.locked=true;
  var pc=$("cardP").firstChild,bc=$("cardB").firstChild;
  pc.classList.remove("pick");
  pc.querySelector('[data-k="'+k+'"]').classList.add("sel");
  bc.querySelector('[data-k="'+k+'"]').classList.add("sel");
  var chooserRow=(byBot?bc:pc).querySelector('[data-k="'+k+'"] .r span');
  chooserRow.innerHTML+='<small class="who'+(byBot?' bot':'')+'">'+(byBot?'🤖 Bot':'🎯 Você')+'</small>';
  $("turnBadge").innerHTML=byBot?'<span class="bot">🤖 O Bot escolheu: '+attrName(k)+'</span>':'<span>🎯 Você escolheu: '+attrName(k)+'</span>';
  $("hint").textContent=byBot?"O Bot escolheu "+attrName(k)+"! Revelando a carta dele...":"Revelando a carta do Bot...";
  setTimeout(function(){
    bc.classList.add("flipped");
    setTimeout(function(){resolve(k,pc,bc)},800);
  },400);
}

function resolve(k,pc,bc){
  var a=st.cp[k],b=st.cb[k],res,cls,msg;
  var ap=pc.querySelector('[data-k="'+k+'"]'),ab=bc.querySelector('[data-k="'+k+'"]');
  var name=attrName(k),nxt;
  if(a>b){res="win";st.hp.b--;msg="🏆 VITÓRIA";ap.classList.add("won");ab.classList.add("lost");pc.classList.add("glow")}
  else if(a<b){res="lose";st.hp.p--;msg="💀 DERROTA";ap.classList.add("lost");ab.classList.add("won");bc.classList.add("glow")}
  else{res="draw";msg="🤝 EMPATE";ap.classList.add("tie");ab.classList.add("tie")}
  st.turn=st.turn==="p"?"b":"p";
  nxt=st.turn==="p"?"Na próxima rodada é a sua vez de escolher.":"Na próxima rodada o Bot escolhe o atributo.";
  $("banner").innerHTML='<span class="msg '+res+'">'+msg+'</span>';
  $("hint").textContent=name+": "+a+" (você) × "+b+" (Bot)"+(res==="draw"?" — ninguém perde vida. ":res==="win"?" — o Bot perde 1 vida. ":" — você perde 1 vida. ")+(st.hp.p>0&&st.hp.b>0?nxt:"");
  hearts("p");hearts("b");
  if(res==="win"){$("hpB").classList.remove("hit");void $("hpB").offsetWidth;$("hpB").classList.add("hit")}
  if(res==="lose"){$("hpP").classList.remove("hit");void $("hpP").offsetWidth;$("hpP").classList.add("hit")}
  if(st.hp.p<=0||st.hp.b<=0){setTimeout(endGame,1800)}
  else{$("btnNext").style.display="inline-block"}
}

function endGame(){
  var w=st.hp.b<=0&&st.hp.p>0;
  var box=$("box");
  box.className="box "+(w?"v":"d");
  $("endEm").textContent=w?"🏆":"💀";
  $("endT").textContent=w?"VITÓRIA!":"DERROTA";
  $("endP").textContent=w?"Você dominou o tema "+st.theme.name+" e derrotou o Bot em "+st.round+" rodadas!":"O Bot venceu esta batalha de "+st.theme.name+" em "+st.round+" rodadas. Tente novamente!";
  $("modal").classList.add("show");
}

$("btnNext").onclick=newRound;
$("btnMenu").onclick=function(){show("sMenu")};
$("btnMenu2").onclick=function(){$("modal").classList.remove("show");show("sMenu")};
$("btnRestart").onclick=function(){start(st.theme)};

buildMenu();
})();
</script>
</body>
</html>
